# 外来只读输入：第三方提供的赛道策略原文及其本地规范化副本。
# 原文禁止手改、禁止提交；规范化副本只能由转写适配器生成并通过 schema 校验，也不提交。
# 缺原文、缺规范化副本或赛道名未命中时，一律落回通用兜底 —— 不报错、不阻断。
foreign_readonly_inputs:
  - id: third_party_track_strategy
    availability: optional
    path: null                    # 有来源后再记录实际本地路径；null 是合法状态，不是待办
    accepted_source: 结构化数据、自由文本或人工转录文本
    normalized_local_path: config/external/track_strategy.normalized.json
    transcription_report_path: config/external/track_strategy.transcription.json
    repository_policy: raw_and_normalized_are_local_only
    missing_behavior: generic_fallback
    ingestion: >
      来源存在时先做可追溯转写/解析，保存来源标识与转写报告，再生成规范化副本并按
      race_strategy_schema 校验；自由文本不得直接驱动 race_controller。来源不存在时
      multiplayer 仍须用假表完成加载、派发、护栏与通用兜底测试，不得等待第三方资料。
    shape: 大地图名 → 小地图名 → 按百分比升序的动作点列表
    note: >
      第三方表不带「过期上界」字段，由适配层补默认值。
      换模型/换表后必须重跑护栏断言（见 contract_freeze_draft.md 第 6 节）。
